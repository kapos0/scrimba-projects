<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color Scheme Generator</title>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <form id="color-form" class="color-form">
                <input type="color" class="color-selector" id="color-selector">
                <select class="mode-selector" id="mode-selector">
                    <option value="monochrome">Monochrome</option>
                    <option value="monochrome-dark">Monochrome-dark</option>
                    <option value="monochrome-light">Monochrome-light</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">Analogic-complement</option>
                    <option value="triad">Triad</option>
                </select>
                <button type="submit" class="submit-btn">Get color scheme</button>
            </form>
            <div class="copy-text">
                <p>Click To Copy</p>
            </div
            <div class="color-container" id="color-container">
                
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
