<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
        <title>Movies</title>
    </head>
    <body>
        <div class="app">
            <header class="hero hero--movies">
                <div class="hero__content">
                    <h1>Find your film</h1>
                    <a class="hero__link" href="watch-list.html"
                        >My Watchlist</a
                    >
                </div>
                <div class="search" aria-label="Movie search">
                    <div class="search__field">
                        <svg
                            class="search__icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M15.5 14h-.79l-.28-.27A6 6 0 1 0 14 15.5l.27.28v.79L20 21.5 21.5 20l-6-6Zm-5.5 0a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
                                fill="currentColor"
                            />
                        </svg>
                        <input
                            type="text"
                            placeholder="Blade Runner"
                            aria-label="Search movies"
                            id="user-input"
                        />
                    </div>
                    <button
                        class="search__button"
                        type="button"
                        id="search-btn"
                    >
                        Search
                    </button>
                </div>
            </header>
            <main class="list" id="movie-list"></main>
        </div>
    </body>
    <script src="script.movies.js"></script>
</html>
